<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patterns in Code and Culture</title>
  <meta
    name="description"
    content="Patterns in Code and Culture — Notes of a Self-Aware Engineer exploring AI, systems, society, and agriculture."
  />

  <!--
    FONT LOADING
    - Zodiak: gives the headings a more reflective/editorial feeling.
    - Satoshi: keeps paragraphs and UI text clean and readable.
  -->
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&f[]=zodiak@400,700&display=swap" rel="stylesheet" />

  <!-- External stylesheet: easier to learn, edit, and grow over time. -->
  <link rel="stylesheet" href="./assets/css/styles.css" />
</head>
<body>
  <!--
    SKIP LINK
    Helps keyboard users jump directly to the main content.
  -->
  <a class="skip-link" href="#main-content">Skip to content</a>

  <!-- =========================================================
       1. SITE HEADER
       - Brand / site title
       - Navigation
       - Theme toggle (light / dark)
     ========================================================= -->
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="#hero" aria-label="Patterns in Code and Culture home">
        <span class="brand-mark" aria-hidden="true">◧</span>
        <span class="brand-text-wrap">
          <span class="brand-title">Patterns in Code and Culture</span>
          <span class="brand-subtitle">Notes of a Self-Aware Engineer</span>
        </span>
      </a>

      <nav class="site-nav" aria-label="Main navigation">
        <a href="#about">About</a>
        <a href="#pillars">Pillars</a>
        <a href="#starting-point">Starting point</a>
      </nav>

      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch theme">
        <span aria-hidden="true">◐</span>
      </button>
    </div>
  </header>

  <main id="main-content">
   /*pitstop*/
  </main>

  <!-- =========================================================
       6. FOOTER
       - Small closing statement.
       - Can later hold social links, email, newsletter, or copyright.
     ========================================================= -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <p>Patterns in Code and Culture — Notes of a Self-Aware Engineer.</p>
      <p>Built as a homepage draft meant to evolve over time.</p>
    </div>
  </footer>

  <script>
    /*
      SIMPLE THEME TOGGLE
      - Uses an in-memory variable only.
      - No localStorage, so it stays compatible in sandboxed environments.
    */
    (function () {
      const root = document.documentElement;
      const toggle = document.querySelector('[data-theme-toggle]');
      let theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';

      root.setAttribute('data-theme', theme);

      toggle.addEventListener('click', function () {
        theme = theme === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', theme);
      });
    }());
  </script>
</body>
</html>
